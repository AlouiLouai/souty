packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# One version of every shared dependency across the workspace. Packages
# reference these with "catalog:" so the two Next.js apps can never drift.
catalog:
  next: 15.5.26
  react: 19.3.0
  react-dom: 19.3.0
  "@vercel/analytics": 2.0.1
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 1.48.0
  tailwind-merge: 3.7.0
  "@eslint/eslintrc": 3.2.0
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  autoprefixer: 10.4.20
  eslint: 9.17.0
  eslint-config-next: 15.5.26
  postcss: 8.4.49
  tailwindcss: 3.4.19
  typescript: 5.7.2
  vitest: 5.1.0
  qrcode: 1.5.4
  "@types/qrcode": 1.5.6
  tsx: 4.23.15

# pnpm 10 runs no dependency build scripts unless they are allow-listed.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - esbuild

# eslint-config-next resolves its plugins from the project root; pnpm 10 no
# longer hoists them by default.
publicHoistPattern:
  - "*eslint*"
